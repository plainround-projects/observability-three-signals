<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 1200 892" role="img" aria-labelledby="t d">
<title id="t">One request through observability-three-signals</title>
<desc id="d">A GET /order/3 reaches front, which calls back with a traceparent header so both share one trace id. Back runs two queries; one request in twenty sleeps for 1.5 seconds in the second. The duration histogram, with an exemplar, and the JSON log line both carry the trace id. Front returns the order with X-Trace-Id, telemetry reaches the Collector in batches, and Grafana follows the p95 spike to the slow SELECT span and its log lines.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="891" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="890" rx="16"/>
<text class="title" x="48" y="68">One slow request, followed through three signals</text>
<text class="caption" x="48" y="100">Row 5 is the planted fault: one request in twenty. The last row is the click path from spike to log line.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">scenario</text>
<rect class="svc" x="540" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="590" y="158" text-anchor="middle">front</text>
<rect class="svc" x="670" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="720" y="158" text-anchor="middle">back</text>
<rect class="svc" x="785" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="850" y="158" text-anchor="middle">PostgreSQL</text>
<rect class="svc" x="915" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="980" y="148" text-anchor="middle">Collector</text>
<text class="lane" x="980" y="168" text-anchor="middle">and stores</text>
<rect class="svc" x="1050" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="1100" y="158" text-anchor="middle">Grafana</text>
<path class="hair" d="M460 176V624M590 176V624M720 176V688M850 176V496M980 176V752M1100 176V816"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">front opens a server span</text>
<text class="sub" x="96" y="232">GET /order/3 gets a trace id</text>
<path class="sync" d="M460 216H590"/>
<text class="label t-accent" x="472" y="206">GET /order/3</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">front calls back</text>
<text class="sub" x="96" y="296">traceparent carries the trace id</text>
<path class="sync" d="M590 280H720"/>
<text class="label t-accent" x="602" y="270">traceparent</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">back joins the same trace</text>
<text class="sub" x="96" y="360">child server span, same trace id</text>
<rect class="slot" x="714" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="736" y="349">child span</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">AssembleOrder is measured</text>
<text class="sub" x="96" y="424">span assemble-order-response</text>
<rect class="slot" x="714" y="390" width="12" height="36" rx="4"/>
<text class="label t-accent" x="736" y="413">measure()</text>
<circle class="dot-w" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-warn" x="96" y="468">Two queries, one maybe slow</text>
<text class="sub" x="96" y="488">1 request in 20 sleeps 1.5 s</text>
<path class="fail" d="M720 472H850"/>
<text class="label t-warn" x="732" y="462">1.5 s sleep</text>
<circle class="dot" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">6-7</text>
<text class="label b t-ink" x="96" y="532">Exemplar and log share the trace</text>
<text class="sub" x="96" y="552">histogram in span; JSON log line</text>
<rect class="slot" x="714" y="518" width="12" height="36" rx="4"/>
<text class="label t-accent" x="736" y="541">trace_id</text>
<circle class="dot" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="596">back answers, front relays</text>
<text class="sub" x="96" y="616">front adds X-Trace-Id</text>
<path class="ok" d="M590 600H460"/>
<text class="label t-good" x="472" y="590">X-Trace-Id</text>
<circle class="dot" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">9</text>
<text class="label b t-ink" x="96" y="660">Telemetry leaves in batches</text>
<text class="sub" x="96" y="680">spans, logs, metrics every 5 s</text>
<path class="async" d="M720 664H980"/>
<text class="label t-accent" x="862" y="654">OTLP</text>
<circle class="dot" cx="66" cy="728" r="15"/>
<text class="num" x="66" y="733" text-anchor="middle">10</text>
<text class="label b t-ink" x="96" y="724">Grafana follows the spike</text>
<text class="sub" x="96" y="744">p95, exemplar, trace, log lines</text>
<path class="read" d="M980 728H1100"/>
<text class="label t-ink" x="992" y="718">reads</text>
<circle class="dot-g" cx="66" cy="792" r="15"/>
<text class="num" x="66" y="797" text-anchor="middle">10b</text>
<text class="label b t-ink" x="96" y="788">The slow span is found</text>
<text class="sub" x="96" y="808">and the log lines for it</text>
<path class="ok" d="M1100 792H807"/>
<rect class="win" x="424" y="772" width="383" height="40" rx="10"/>
<text class="label b t-good" x="440" y="797">the 1.5 s SELECT span and its log lines</text>
<path class="sync" d="M48 848H112"/><text class="legend" x="124" y="853">sync call</text>
<path class="async" d="M264 848H328"/><text class="legend" x="340" y="853">async message</text>
<path class="read" d="M520 848H584"/><text class="legend" x="596" y="853">read</text>
<path class="fail" d="M696 848H760"/><text class="legend" x="772" y="853">failure path</text>
<path class="ok" d="M928 848H992"/><text class="legend" x="1004" y="853">result</text>
</svg>
