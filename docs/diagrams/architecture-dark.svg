<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d">
<title id="t">Architecture of observability-three-signals</title>
<desc id="d">A scenario or curl calls front, which calls back with a traceparent header. Back runs two queries against PostgreSQL, and the second one is planted to sleep for 1.5 seconds on one request in twenty. Front and back send spans, metrics and logs over OTLP to the OpenTelemetry Collector, which sends traces to Tempo, serves metrics on port 8889 for Prometheus to scrape, and sends logs to Loki. Grafana reads all three and links an exemplar to its trace, a span to its logs, and a log line to its trace.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="839" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="838" rx="16"/>
<text class="title" x="48" y="68">Two services, one Collector, three backends</text>
<text class="caption" x="48" y="100">Amber: the planted slow query. The Collector is the only thing the services talk to for telemetry.</text>
<rect class="actor" x="48" y="182" width="160" height="72" rx="36"/>
<text class="name" x="128" y="214" text-anchor="middle">scenario</text>
<text class="sub" x="128" y="236" text-anchor="middle">or curl</text>
<rect class="boundary" x="240" y="132" width="912" height="628" rx="14"/>
<text class="tag" x="256" y="160">Docker Compose, every port on 127.0.0.1</text>
<rect class="svc" x="384" y="176" width="176" height="84" rx="12"/>
<text class="name" x="400" y="208">front</text>
<text class="sub" x="400" y="232">GET /order/id</text>
<text class="sub" x="400" y="254">timeout, retries</text>
<rect class="svc" x="704" y="176" width="176" height="84" rx="12"/>
<text class="name" x="720" y="208">back</text>
<text class="sub" x="720" y="232">two SQL queries</text>
<text class="sub" x="720" y="254">assembly span</text>
<path class="store" d="M976 188a80 12 0 0 1 160 0v102a80 12 0 0 1 -160 0z"/>
<path class="rim" d="M976 188a80 12 0 0 0 160 0"/>
<text class="name" x="1056" y="225" text-anchor="middle">PostgreSQL</text>
<text class="sub" x="1056" y="249" text-anchor="middle">orders</text>
<text class="sub" x="1056" y="273" text-anchor="middle">order_items</text>
<rect class="svc" x="384" y="332" width="512" height="84" rx="12"/>
<text class="name" x="400" y="364">OpenTelemetry Collector</text>
<text class="sub" x="400" y="388">spans, metrics, logs in</text>
<text class="sub" x="400" y="410">memory_limiter, batch</text>
<path class="store" d="M392 492a80 12 0 0 1 160 0v76a80 12 0 0 1 -160 0z"/>
<path class="rim" d="M392 492a80 12 0 0 0 160 0"/>
<text class="name" x="472" y="528" text-anchor="middle">Tempo</text>
<text class="sub" x="472" y="552" text-anchor="middle">traces</text>
<path class="store" d="M576 492a80 12 0 0 1 160 0v76a80 12 0 0 1 -160 0z"/>
<path class="rim" d="M576 492a80 12 0 0 0 160 0"/>
<text class="name" x="656" y="528" text-anchor="middle">Prometheus</text>
<text class="sub" x="656" y="552" text-anchor="middle">exemplars</text>
<path class="store" d="M760 492a80 12 0 0 1 160 0v76a80 12 0 0 1 -160 0z"/>
<path class="rim" d="M760 492a80 12 0 0 0 160 0"/>
<text class="name" x="840" y="528" text-anchor="middle">Loki</text>
<text class="sub" x="840" y="552" text-anchor="middle">logs</text>
<rect class="svc" x="392" y="616" width="528" height="116" rx="12"/>
<text class="name" x="408" y="648">Grafana</text>
<text class="sub" x="408" y="672">exemplar opens the trace in Tempo</text>
<text class="sub" x="408" y="694">logs for this span, in Loki</text>
<text class="sub" x="408" y="716">a trace_id in a log opens Tempo</text>
<rect class="note" x="936" y="330" width="200" height="100" rx="10"/>
<text class="label b t-warn" x="952" y="360">1 request in 20</text>
<text class="sub" x="952" y="386">second query runs</text>
<text class="sub" x="952" y="408">pg_sleep for 1.5 s</text>
<path class="sync" d="M208 218H384"/>
<text class="label t-accent" x="252" y="208">GET /order/id</text>
<path class="sync" d="M560 218H704"/>
<text class="label t-accent" x="572" y="208">GET /order/id</text>
<text class="label t-accent" x="572" y="238">traceparent</text>
<path class="fail" d="M880 218H976"/>
<text class="label t-warn" x="888" y="208">2 queries</text>
<path class="async" d="M472 260V332"/>
<text class="label t-accent" x="484" y="302">OTLP</text>
<path class="async" d="M792 260V332"/>
<text class="label t-accent" x="804" y="302">OTLP</text>
<path class="async" d="M472 416V480"/>
<text class="label t-accent" x="484" y="454">traces</text>
<path class="read" d="M656 416V480"/>
<text class="label t-ink" x="668" y="454">scraped :8889</text>
